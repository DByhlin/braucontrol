                              id(active_mash_steps)++;
                              id(editing_mash_step) = id(active_mash_steps);
                              auto t = BM_TEMPS; auto m = BM_TIMES;
                              if (*t.at(id(active_mash_steps) - 1) < 30.0f) *t.at(id(active_mash_steps) - 1) = 65.0f;
                              if (*m.at(id(active_mash_steps) - 1) == 0) *m.at(id(active_mash_steps) - 1) = 15;
