    - id: wifi_page
      widgets:
        - *home_btn
        - label:
            x: 140
            y: 12
            text: "WIFI SETTINGS (2.4 GHz)"
        - label:
            id: wifi_conn_info
            x: 140
            y: 34
            text_color: 0xF59E0B
            text: "Status: Checking connection..."
        - keyboard:
            id: on_screen_kb
            align: BOTTOM_MID
            width: 800
            height: 245
        - button:
            x: 20
            y: 68
            width: 130
            height: 48
            bg_color: 0x1D4ED8
            on_click:
              - lambda: |-
                  lv_label_set_text(id(wifi_conn_info), "Scanning for 2.4 GHz networks...");
                  wifi_scan_config_t scan_config = {};
                  scan_config.show_hidden = false;
                  if (esp_wifi_scan_start(&scan_config, true) == ESP_OK) {
                    uint16_t ap_count = 0;
                    esp_wifi_scan_get_ap_num(&ap_count);
                    if (ap_count > 15) ap_count = 15;
                    if (ap_count > 0) {
                      std::vector<wifi_ap_record_t> ap_list(ap_count);
                      if (esp_wifi_scan_get_ap_records(&ap_count, ap_list.data()) == ESP_OK) {
                        std::string opts = "";
                        for (int i = 0; i < ap_count; i++) {
                          std::string ssid_str(reinterpret_cast<const char*>(ap_list.at(i).ssid));
                          if (!ssid_str.empty()) {
                            if (!opts.empty()) opts += "\n";
                            opts += ssid_str;
                          }
                        }
                        if (!opts.empty()) {
                          lv_dropdown_set_options(id(wifi_ssid_dd)->obj, opts.c_str());
                          lv_label_set_text(id(wifi_conn_info), ("Found " + std::to_string(ap_count) + " network(s)").c_str());
                        }
                      }
                    } else {
                      lv_label_set_text(id(wifi_conn_info), "No 2.4 GHz networks found");
                    }
                  } else {
                    lv_label_set_text(id(wifi_conn_info), "Scan failed - try again");
                  }
            widgets:
              - label:
                  align: CENTER
                  text: "SCAN"
        - dropdown:
            id: wifi_ssid_dd
            x: 160
            y: 68
            width: 320
            height: 48
            options:
              - "Tap SCAN to find Wi-Fi"
        - textarea:
            id: wifi_pass_ta
            x: 490
            y: 68
            width: 290
            height: 48
            placeholder_text: "Wi-Fi Password"
            password_mode: true
            one_line: true
            on_click:
              - lvgl.keyboard.update:
                  id: on_screen_kb
                  textarea: wifi_pass_ta
        - button:
            x: 20
            y: 128
            width: 260
            height: 48
            bg_color: 0x059669
            on_click:
              - lambda: |-
                  std::vector<char> selected_ssid(64, 0);
                  lv_dropdown_get_selected_str(id(wifi_ssid_dd)->obj, selected_ssid.data(), selected_ssid.size());
                  const char *pass = lv_textarea_get_text(id(wifi_pass_ta));
                  if (std::string(selected_ssid.data()) != "Tap SCAN to find Wi-Fi") {
                    id(my_wifi).save_wifi_sta(selected_ssid.data(), pass);
                    lv_label_set_text(id(wifi_conn_info), "Saved! Rebooting to connect...");
                    delay(500);
                    App.safe_reboot();
                  }
            widgets:
              - label:
                  align: CENTER
                  text: "SAVE & CONNECT"
