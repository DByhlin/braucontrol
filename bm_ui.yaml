.anchors:
  home_btn: &home_btn
    button:
      x: 15
      y: 10
      width: 110
      height: 44
      bg_color: 0x1E293B
      radius: 10
      on_click:
        - lvgl.page.show:
            id: home_page
            animation: NONE
      widgets:
        - label:
            align: CENTER
            text_color: 0xFFFFFF
            text: "< HOME"
  hw_btn: &hw_btn
    width: 170
    height: 50
  step_slate: &step_slate
    width: 74
    height: 68
    bg_color: 0x334155
  step_dark: &step_dark
    width: 68
    height: 68
    bg_color: 0x1E293B

lvgl:
  top_layer:
    widgets:
      - obj:
          id: boot_screen
          width: 800
          height: 480
          bg_color: 0x111111
          border_width: 0
          radius: 0
          widgets:
            - label:
                id: boot_title
                align: CENTER
                y: -70
                text: "BrauControl"
                text_font: montserrat_42
                text_color: 0xFFFFFF
            - bar:
                id: wifi_progress_bar
                align: CENTER
                y: 0
                width: 450
                height: 20
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x333333
                indicator:
                  bg_color: 0xE67E22  # Brewing amber/orange accent
            - label:
                id: boot_status_label
                align: CENTER
                y: 45
                text: "Initializing system and webserver..."
                text_color: 0xAAAAAA
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 100%
  theme:
    page:
      bg_color: 0x0B0F17
    button:
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 12
      pressed:
        bg_color: 0x0F172A
        translate_y: 2
    tabview:
      bg_color: 0x0B0F17
  pages:
    - id: home_page
      widgets:
        - obj:
            x: 25
            y: 10
            width: 345
            height: 38
            bg_color: 0x1E293B
            border_width: 2
            border_color: 0x000000
            radius: 8
            scrollable: false
            pad_all: 0
            widgets:
              - label:
                  align: CENTER
                  text_color: 0xFACC15
                  text: "BrauControl - Universal brew controller"
        - label:
            id: home_wifi_lbl
            align: TOP_RIGHT
            x: -25
            y: 18
            text_color: 0xF59E0B
            text: "WIFI: CHECKING..."
        - label:
            id: home_hw_badge
            x: 25
            y: 55
            text_color: 0x94A3B8
            text: "CONFIG: 2 EL | 2 PUMP | 16A"

        - button:
            x: 25
            y: 92
            width: 365
            height: 175
            bg_color: 0x065F46
            border_color: 0x10B981
            radius: 16
            on_click:
              - lvgl.page.show:
                  id: brew_page
                  animation: NONE
            widgets:
              - label:
                  align: CENTER
                  y: -14
                  text_font: montserrat_28
                  text: "BREW SESSION"
              - label:
                  align: CENTER
                  y: 24
                  text_color: 0xA7F3D0
                  text: "Mash, Boil & Manual Control"

        - button:
            x: 410
            y: 92
            width: 365
            height: 175
            bg_color: 0x1E3A8A
            border_color: 0x3B82F6
            radius: 16
            on_click:
              - lvgl.page.show:
                  id: recipe_page
                  animation: NONE
            widgets:
              - label:
                  align: CENTER
                  y: -14
                  text_font: montserrat_28
                  text: "RECIPE BUILDER"
              - label:
                  align: CENTER
                  y: 24
                  text_color: 0xBFDBFE
                  text: "8-Step Mash, Hops & Slots"

        - button:
            x: 25
            y: 285
            width: 365
            height: 175
            bg_color: 0x1E293B
            border_color: 0x475569
            radius: 16
            on_click:
              - lvgl.page.show:
                  id: hardware_page
                  animation: NONE
            widgets:
              - label:
                  align: CENTER
                  y: -14
                  text_font: montserrat_28
                  text: "HARDWARE SETUP"
              - label:
                  align: CENTER
                  y: 24
                  text_color: 0xCBD5E1
                  text: "Model, Fuse Limit & PID Tune"

        - button:
            x: 410
            y: 285
            width: 365
            height: 175
            bg_color: 0x4C1D95
            border_color: 0x8B5CF6
            radius: 16
            on_click:
              - lvgl.page.show:
                  id: wifi_page
                  animation: NONE
            widgets:
              - label:
                  align: CENTER
                  y: -14
                  text_font: montserrat_28
                  text: "WIFI SETTINGS"
              - label:
                  align: CENTER
                  y: 24
                  text_color: 0xDDD6FE
                  text: "Scan & Connect 2.4 GHz"
    - id: brew_page
      widgets:
        - *home_btn
        - label:
            id: lvgl_status_lbl
            x: 140
            y: 10
            text_color: 0xF8FAFC
            text: "IDLE - READY TO BREW"
        - label:
            id: lvgl_wifi_lbl
            align: TOP_RIGHT
            x: -15
            y: 10
            text_color: 0xF59E0B
            text: "WIFI: CHECKING..."
        - label:
            id: lbl_brew_recipe
            align: TOP_RIGHT
            x: -15
            y: 34
            text_color: 0x38BDF8
            text: "Recipe: Custom Braumeister Brew"
        - label:
            id: lvgl_hw_badge
            x: 140
            y: 34
            text_color: 0x94A3B8
            text: "CONFIG: 2 EL | 2 PUMP | 16A"

        - obj:
            x: 20
            y: 66
            width: 245
            height: 192
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - arc:
                  id: arc_kettle_temp
                  align: CENTER
                  y: 10
                  width: 146
                  height: 146
                  min_value: 20
                  max_value: 100
                  value: 20
                  adjustable: false
                  arc_width: 12
                  arc_color: 0x1E293B
                  indicator:
                    arc_width: 12
                    arc_color: 0xF59E0B
              - label:
                  align: TOP_MID
                  y: 8
                  text_color: 0x94A3B8
                  text: "KETTLE"
              - label:
                  id: lbl_kettle_temp
                  align: CENTER
                  y: 10
                  text_font: montserrat_28
                  text_color: 0xF8FAFC
                  text: "--.- C"

        - obj:
            x: 280
            y: 66
            width: 245
            height: 192
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text_color: 0x94A3B8
                  text: "TARGET TEMP"
              - label:
                  id: lbl_target_temp
                  align: CENTER
                  y: 6
                  text_font: montserrat_28
                  text_color: 0x38BDF8
                  text: "63.0 C"
              - label:
                  id: lbl_step_badge
                  align: BOTTOM_MID
                  y: -14
                  text_color: 0x94A3B8
                  text: "Ready: Step 1 of 3"

        - obj:
            x: 540
            y: 66
            width: 240
            height: 192
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - label:
                  align: TOP_MID
                  y: 14
                  text_color: 0x94A3B8
                  text: "STEP TIMER"
              - label:
                  id: lbl_timer
                  align: CENTER
                  y: 6
                  text_font: montserrat_28
                  text_color: 0x34D399
                  text: "00:00"
              - label:
                  id: lbl_sec_temp
                  align: BOTTOM_MID
                  y: -14
                  text_color: 0x94A3B8
                  text: "Aux: --.- C"
        - button:
            id: pill_htr1
            x: 20
            y: 272
            width: 180
            height: 54
            bg_color: 0x1E293B
            radius: 27
            on_click:
              - lambda: |-
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); id(manual_htr_2) = false; }
                  id(manual_htr_1) = !id(manual_htr_1);
                  if (id(manual_htr_1) && id(max_amps) > 0 && id(max_amps) <= 13) id(manual_htr_2) = false;
                  id(heater_1_pwm).set_level(id(manual_htr_1) ? 1.0f : 0.0f);
                  id(heater_2_pwm).set_level((id(num_elements) == 2 && id(manual_htr_2)) ? 1.0f : 0.0f);
                  id(status_text) = "MANUAL OVERRIDE";
            widgets:
              - label:
                  id: lbl_pill_htr1
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "HTR 1: OFF"

        - button:
            id: pill_htr2
            x: 213
            y: 272
            width: 180
            height: 54
            bg_color: 0x1E293B
            radius: 27
            on_click:
              - lambda: |-
                  if (id(num_elements) != 2) return;
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); id(manual_htr_1) = false; }
                  id(manual_htr_2) = !id(manual_htr_2);
                  if (id(manual_htr_2) && id(max_amps) > 0 && id(max_amps) <= 13) id(manual_htr_1) = false;
                  id(heater_1_pwm).set_level(id(manual_htr_1) ? 1.0f : 0.0f);
                  id(heater_2_pwm).set_level(id(manual_htr_2) ? 1.0f : 0.0f);
                  id(status_text) = "MANUAL OVERRIDE";
            widgets:
              - label:
                  id: lbl_pill_htr2
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "HTR 2: OFF"

        - button:
            id: pill_pump1
            x: 407
            y: 272
            width: 180
            height: 54
            bg_color: 0x1E293B
            radius: 27
            on_click:
              - lambda: |-
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); }
                  id(pump_1).toggle();
                  id(status_text) = "MANUAL OVERRIDE";
                  if (!std::isnan(id(kettle_temp).state) && id(kettle_temp).state >= 88.0f) {
                  id(status_text) = "PUMP LOCKOUT: TEMP >= 88C";
                  return;
                  }

            widgets:
              - label:
                  id: lbl_pill_pump1
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "PUMP 1: OFF"

        - button:
            id: pill_pump2
            x: 600
            y: 272
            width: 180
            height: 54
            bg_color: 0x1E293B
            radius: 27
            on_click:
              - lambda: |-
                  if (id(num_pumps) != 2) return;
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); }
                  id(pump_2).toggle();
                  id(status_text) = "MANUAL OVERRIDE";
                  if (!std::isnan(id(kettle_temp).state) && id(kettle_temp).state >= 88.0f) {
                  id(status_text) = "PUMP LOCKOUT: TEMP >= 88C";
                  return;
                  }
            widgets:
              - label:
                  id: lbl_pill_pump2
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "PUMP 2: OFF"
        - button:
            x: 20
            y: 344
            width: 245
            height: 112
            bg_color: 0x059669
            border_color: 0x34D399
            radius: 14
            on_click:
              - script.execute: cmd_start_brew
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_28
                  text: "START"

        - button:
            x: 280
            y: 344
            width: 245
            height: 112
            bg_color: 0xDC2626
            border_color: 0xF87171
            radius: 14
            on_click:
              - script.execute: cmd_stop_all
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_28
                  text: "STOP"

        - button:
            x: 540
            y: 344
            width: 240
            height: 112
            bg_color: 0xD97706
            border_color: 0xFBBF24
            radius: 14
            on_click:
              - script.execute: cmd_start_boil
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_28
                  text: "BOIL"

        - obj:
            id: step_confirm_modal
            align: CENTER
            width: 560
            height: 250
            bg_color: 0x0F172A
            border_width: 3
            border_color: 0xF59E0B
            radius: 16
            hidden: true
            scrollable: false
            pad_all: 0
            widgets:
              - label:
                  id: lbl_modal_title
                  align: TOP_MID
                  y: 22
                  text_font: montserrat_28
                  text_color: 0xFACC15
                  text: "STEP 1 COMPLETE!"
              - label:
                  id: lbl_modal_body
                  align: CENTER
                  y: -12
                  text_color: 0xF8FAFC
                  text: "Check mash / stir, then tap CONTINUE"
              - button:
                  x: 130
                  y: 162
                  width: 300
                  height: 64
                  bg_color: 0x059669
                  border_color: 0x34D399
                  radius: 12
                  on_click:
                    - script.execute: cmd_confirm_step
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_28
                        text_color: 0xFFFFFF
                        text: "CONTINUE"
    - id: hardware_page
      widgets:
        - *home_btn
        - label:
            x: 140
            y: 20
            text_color: 0x0F172A
            text: "BRAUMEISTER HARDWARE CONFIGURATION"

        - label:
            x: 25
            y: 78
            text_color: 0x0F172A
            text: "Model Preset:"
        - button:
            <<: *hw_btn
            x: 220
            y: 66
            on_click:
              - lambda: 'id(num_elements) = 1; id(num_pumps) = 1; id(pump_2).turn_off();'
            widgets:
              - label:
                  align: CENTER
                  text: "BM10 / BM20"
        - button:
            <<: *hw_btn
            x: 405
            y: 66
            on_click:
              - lambda: 'id(num_elements) = 2; id(num_pumps) = 2;'
            widgets:
              - label:
                  align: CENTER
                  text: "BM50"

        - label:
            x: 25
            y: 148
            text_color: 0x0F172A
            text: "Heating Elements:"
        - button:
            <<: *hw_btn
            x: 220
            y: 136
            on_click:
              - lambda: 'id(num_elements) = 1;'
            widgets:
              - label:
                  align: CENTER
                  text: "1 ELEMENT"
        - button:
            <<: *hw_btn
            x: 405
            y: 136
            on_click:
              - lambda: 'id(num_elements) = 2;'
            widgets:
              - label:
                  align: CENTER
                  text: "2 ELEMENTS"

        - label:
            x: 25
            y: 218
            text_color: 0x0F172A
            text: "Circulation Pumps:"
        - button:
            <<: *hw_btn
            x: 220
            y: 206
            on_click:
              - lambda: 'id(num_pumps) = 1; id(pump_2).turn_off();'
            widgets:
              - label:
                  align: CENTER
                  text: "1 PUMP"
        - button:
            <<: *hw_btn
            x: 405
            y: 206
            on_click:
              - lambda: 'id(num_pumps) = 2;'
            widgets:
              - label:
                  align: CENTER
                  text: "2 PUMPS"
        - label:
            x: 25
            y: 288
            text_color: 0x0F172A
            text: "230V Fuse Limit:"
        - button:
            id: btn_amp_10
            x: 220
            y: 276
            width: 125
            height: 50
            on_click:
              - lambda: 'id(max_amps) = 10;'
            widgets:
              - label:
                  align: CENTER
                  text: "10A (2.3kW)"
        - button:
            id: btn_amp_13
            x: 355
            y: 276
            width: 125
            height: 50
            on_click:
              - lambda: 'id(max_amps) = 13;'
            widgets:
              - label:
                  align: CENTER
                  text: "13A (3.0kW)"
        - button:
            id: btn_amp_16
            x: 490
            y: 276
            width: 125
            height: 50
            on_click:
              - lambda: 'id(max_amps) = 16;'
            widgets:
              - label:
                  align: CENTER
                  text: "16A (3.6kW)"
        - button:
            id: btn_amp_0
            x: 625
            y: 276
            width: 125
            height: 50
            on_click:
              - lambda: 'id(max_amps) = 0;'
            widgets:
              - label:
                  align: CENTER
                  text: "MAX / OFF"

        - label:
            id: hw_page_status
            x: 25
            y: 332
            text_color: 0x1D4ED8
            text: "CONFIG: 2 EL | 2 PUMP | 16A"

        - obj:
            id: autotune_banner
            x: 25
            y: 360
            width: 725
            height: 44
            bg_color: 0x1E293B
            border_width: 1
            border_color: 0x334155
            radius: 10
            scrollable: false
            pad_all: 0
            widgets:
              - label:
                  id: lbl_autotune_banner
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "PID TUNER: IDLE (Fill kettle with water before tuning)"

        - button:
            id: btn_pid_autotune
            x: 25
            y: 412
            width: 355
            height: 52
            bg_color: 0x059669
            on_click:
              - lambda: |-
                  if (std::isnan(id(kettle_temp).state)) {
                    id(status_text) = "ERROR: NO KETTLE TEMP SENSOR!";
                    lv_obj_set_style_bg_color(id(autotune_banner), lv_color_hex(0xDC2626), 0);
                    lv_label_set_text(id(lbl_autotune_banner), "ERROR: NO KETTLE TEMP PROBE DETECTED!");
                    return;
                  }
                  id(manual_htr_1) = false;
                  id(manual_htr_2) = false;
                  id(autotune_elapsed_sec) = 0;
                  id(brew_state) = 5;
                  id(pump_1).turn_on();
                  if (id(num_pumps) == 2) id(pump_2).turn_on();
                  id(status_text) = "PID AUTOTUNE IN PROGRESS (65 C)";
              - climate.control:
                  id: bm_pid
                  mode: HEAT
                  target_temperature: 65°C
              - climate.pid.autotune: bm_pid
            widgets:
              - label:
                  align: CENTER
                  text_color: 0xFFFFFF
                  text: "START PID AUTOTUNE (65°C)"

        - button:
            x: 395
            y: 412
            width: 355
            height: 52
            bg_color: 0xDC2626
            on_click:
              - script.execute: cmd_stop_all
            widgets:
              - label:
                  align: CENTER
                  text_color: 0xFFFFFF
                  text: "STOP / ABORT AUTOTUNE"
    - id: recipe_page
      bg_color: 0xF1F5F9
      widgets:
        - *home_btn
        - textarea:
            id: recipe_name_ta
            x: 140
            y: 10
            width: 645
            height: 44
            text: "Custom Braumeister Brew"
            placeholder_text: "Tap to rename recipe..."
            one_line: true
            on_click:
              - lvgl.keyboard.update:
                  id: recipe_kb
                  textarea: recipe_name_ta
              - lvgl.widget.show: recipe_kb
            on_ready:
              - lambda: 'id(recipe_name) = lv_textarea_get_text(id(recipe_name_ta));'
              - lvgl.widget.hide: recipe_kb

        - tabview:
            id: recipe_tabs
            x: 15
            y: 62
            width: 770
            height: 405
            bg_color: 0xFFFFFF
            tabs:
              - name: "MASH STEPS"
                pad_all: 6
                scrollable: false
                widgets:
                  - obj:
                      x: 6
                      y: 6
                      width: 265
                      height: 256
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scroll_dir: VER
                      scrollbar_mode: AUTO
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        pad_row: 6
                      widgets:
                        - button:
                            id: btn_sel_m1
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 1;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m1
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 1: 63C • 45m"
                        - button:
                            id: btn_sel_m2
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 2;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m2
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 2: 72C • 15m"
                        - button:
                            id: btn_sel_m3
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 3;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m3
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 3: 78C • 10m"
                        - button:
                            id: btn_sel_m4
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 4;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m4
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 4: 65C • 0m"
                        - button:
                            id: btn_sel_m5
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 5;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m5
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 5: 78C • 0m"
                        - button:
                            id: btn_sel_m6
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 6;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m6
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 6: 65C • 0m"
                        - button:
                            id: btn_sel_m7
                            width: 252
                            height: 46
                            on_click:
                              - lambda: 'id(editing_mash_step) = 7;'
                              - script.execute: update_recipe_highlights
                            widgets:
                              - label:
                                  id: lbl_m7
                                  align: CENTER
                                  text_color: 0xFFFFFF
                                  text: "Step 7: 65C • 0m"
                        - button:
                            id: btn_sel_m8
                            width: 252
                            height: 46
                            on_click:
