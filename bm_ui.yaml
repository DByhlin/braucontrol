        # Right Card: 2.4 GHz Network Selector & Credentials
        - obj:
            x: 355
            y: 72
            width: 425
            height: 152
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - button:
                  x: 14
                  y: 14
                  width: 110
                  height: 46
                  bg_color: 0x1D4ED8
                  border_color: 0x3B82F6
                  on_click:
                    - lambda: |-
                        lv_label_set_text(id(wifi_conn_info), "Scanning for 2.4 GHz networks...");
                        wifi_scan_config_t scan_config = {};
                        scan_config.show_hidden = false;
                        if (esp_wifi_scan_start(&scan_config, true) == ESP_OK) {
                          uint16_t ap_count = 0;
                          esp_wifi_scan_get_ap_num(&ap_count);
                          if (ap_count > 15) ap_count = 15;
                          if (ap_count > 0) {
                            std::vector<wifi_ap_record_t> ap_list(ap_count);
                            if (esp_wifi_scan_get_ap_records(&ap_count, ap_list.data()) == ESP_OK) {
                              std::string opts = "";
                              for (int i = 0; i < ap_count; i++) {
                                std::string ssid_str = bm_safe_ssid(ap_list.at(i).ssid);
                                if (!ssid_str.empty()) {
                                  if (!opts.empty()) opts += "\n";
                                  opts += ssid_str;
                                }
                              }
                              if (!opts.empty()) {
                                lv_dropdown_set_options(id(wifi_ssid_dd)->obj, opts.c_str());
                                lv_label_set_text(id(wifi_conn_info), ("Found " + std::to_string(ap_count) + " network(s)").c_str());
                              }
                            }
                          } else {
                            lv_label_set_text(id(wifi_conn_info), "No 2.4 GHz networks found");
                          }
                        } else {
                          lv_label_set_text(id(wifi_conn_info), "Scan failed - try again");
                        }
                  widgets:
                    - label:
                        align: CENTER
                        text: "SCAN"
              - dropdown:
                  id: wifi_ssid_dd
                  x: 134
                  y: 14
                  width: 277
                  height: 46
                  options:
                    - "Tap SCAN to find Wi-Fi"
              - textarea:
                  id: wifi_pass_ta
                  x: 14
                  y: 74
                  width: 225
                  height: 52
                  placeholder_text: "Wi-Fi Password"
                  password_mode: true
                  one_line: true
                  on_click:
                    - lvgl.keyboard.update:
                        id: on_screen_kb
                        textarea: wifi_pass_ta
                    - lvgl.widget.show: on_screen_kb
                  on_ready:
                    - lvgl.widget.hide: on_screen_kb
              - button:
                  id: btn_wifi_eye
                  x: 247
                  y: 74
                  width: 68
                  height: 52
                  bg_color: 0x1E293B
                  on_click:
                    - lambda: |-
                        bool cur = lv_textarea_get_password_mode(id(wifi_pass_ta));
                        lv_textarea_set_password_mode(id(wifi_pass_ta), !cur);
                        lv_label_set_text(id(lbl_wifi_eye), cur ? "HIDE" : "SHOW");
                  widgets:
                    - label:
                        id: lbl_wifi_eye
                        align: CENTER
                        text: "SHOW"
              - button:
                  x: 323
                  y: 74
                  width: 88
                  height: 52
                  bg_color: 0x059669
                  border_color: 0x34D399
                  on_click:
                    - lambda: |-
                        std::vector<char> selected_ssid(64, 0);
                        lv_dropdown_get_selected_str(id(wifi_ssid_dd)->obj, selected_ssid.data(), selected_ssid.size());
                        const char *pass = lv_textarea_get_text(id(wifi_pass_ta));
                        if (std::string(selected_ssid.data()) != "Tap SCAN to find Wi-Fi") {
                          id(my_wifi).save_wifi_sta(selected_ssid.data(), pass);
                          lv_label_set_text(id(wifi_conn_info), "Saved! Rebooting to connect...");
                          App.scheduler.set_timeout(nullptr, "wifi_reboot", 600, []() {
                            App.safe_reboot();
                          });
                        }
                  widgets:
                    - label:
                        align: CENTER
                        text: "SAVE"

