.anchors:
  home_btn: &home_btn
    button:
      x: 15
      y: 10
      width: 110
      height: 44
      bg_color: 0x1E293B
      radius: 10
      on_click:
        - lvgl.page.show:
            id: home_page
            animation: NONE
      widgets:
        - label:
            align: CENTER
            text_color: 0xF8FAFC
            text: "< HOME"
  hw_btn: &hw_btn
    width: 170
    height: 50
  step_slate: &step_slate
    width: 74
    height: 68
    bg_color: 0x334155
  step_dark: &step_dark
    width: 68
    height: 68
    bg_color: 0x1E293B

lvgl:
  top_layer:
    widgets:
      - obj:
          id: boot_screen
          width: 800
          height: 480
          bg_color: 0x0B0F17
          border_width: 0
          radius: 0
          widgets:
            - label:
                id: boot_title
                align: CENTER
                y: -70
                text: "BrauControl"
                text_font: montserrat_42
                text_color: 0xF8FAFC
            - bar:
                id: wifi_progress_bar
                align: CENTER
                y: 0
                width: 450
                height: 20
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x1E293B
                indicator:
                  bg_color: 0xF59E0B
            - label:
                id: boot_status_label
                align: CENTER
                y: 45
                text: "Initializing system and webserver..."
                text_color: 0x94A3B8
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 100%
  theme:
    dark_mode: true
    label:
      text_color: 0xF8FAFC
    button:
      bg_color: 0x1E293B
      border_width: 1
      border_color: 0x334155
      radius: 12
      pressed:
        bg_color: 0x0F172A
        translate_y: 2
    tabview:
      bg_color: 0x111827
    textarea:
      bg_color: 0x1E293B
      text_color: 0xF8FAFC
      border_color: 0x334155
      border_width: 1
    dropdown:
      bg_color: 0x1E293B
      text_color: 0xF8FAFC
      border_color: 0x334155
      border_width: 1
  pages:
    - id: home_page
      widgets:
        # Top Header Bar
        - obj:
            x: 20
            y: 12
            width: 760
            height: 64
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - label:
                  x: 18
                  y: 6
                  text_font: montserrat_28
                  text_color: 0xFACC15
                  text: "BrauControl"
              - label:
                  id: home_hw_badge
                  x: 18
                  y: 40
                  text_color: 0x94A3B8
                  text: "3300W | 2 EL | 2 PMP | 16A"
              - label:
                  id: home_status_badge
                  align: TOP_MID
                  y: 22
                  text_color: 0x38BDF8
                  text: "IDLE | --.- C"
              - label:
                  id: home_wifi_lbl
                  align: TOP_RIGHT
                  x: -18
                  y: 22
                  text_color: 0xF59E0B
                  text: "WIFI: CHECKING..."

        # Tile 1: Brew Session (Emerald Accent + Kettle Icon)
        - button:
            x: 20
            y: 92
            width: 370
            height: 175
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 16
            on_click:
              - lvgl.page.show:
                  id: brew_page
                  animation: NONE
            widgets:
              - obj:
                  x: 0
                  y: 24
                  width: 6
                  height: 125
                  bg_color: 0x10B981
                  border_width: 0
                  radius: 3
              # Kettle Vector Icon
              - obj:
                  x: 24
                  y: 30
                  width: 38
                  height: 38
                  bg_opa: TRANSP
                  border_width: 0
                  scrollable: false
                  pad_all: 0
                  widgets:
                    - obj:
                        x: 15
                        y: 2
                        width: 8
                        height: 4
                        bg_color: 0x10B981
                        border_width: 0
                        radius: 2
                    - obj:
                        x: 7
                        y: 6
                        width: 24
                        height: 4
                        bg_color: 0x10B981
                        border_width: 0
                        radius: 2
                    - obj:
                        x: 2
                        y: 14
                        width: 6
                        height: 10
                        bg_opa: TRANSP
                        border_width: 2
                        border_color: 0x10B981
                        radius: 3
                    - obj:
                        x: 30
                        y: 14
                        width: 6
                        height: 10
                        bg_opa: TRANSP
                        border_width: 2
                        border_color: 0x10B981
                        radius: 3
                    - obj:
                        x: 7
                        y: 12
                        width: 24
                        height: 23
                        bg_opa: TRANSP
                        border_width: 3
                        border_color: 0x10B981
                        radius: 4
              - label:
                  x: 72
                  y: 34
                  text_font: montserrat_28
                  text_color: 0x10B981
                  text: "BREW SESSION"
              - label:
                  x: 26
                  y: 84
                  text_color: 0xCBD5E1
                  text: "Automated Mash, Boil & Manual Control"
              - label:
                  x: 26
                  y: 118
                  text_color: 0x64748B
                  text: "Tap to monitor gauges & run brew ->"
        # Tile 2: Recipe Builder (Blue Accent + Open Book Icon)
        - button:
            x: 410
            y: 92
            width: 370
            height: 175
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 16
            on_click:
              - script.execute: sync_recipe_sliders
              - lvgl.page.show:
                  id: recipe_page
                  animation: NONE
            widgets:
              - obj:
                  x: 0
                  y: 24
                  width: 6
                  height: 125
                  bg_color: 0x3B82F6
                  border_width: 0
                  radius: 3
              # Open Book Vector Icon
              - obj:
                  x: 24
                  y: 30
                  width: 38
                  height: 38
                  bg_opa: TRANSP
                  border_width: 0
                  scrollable: false
                  pad_all: 0
                  widgets:
                    - obj:
                        x: 3
                        y: 6
                        width: 17
                        height: 26
                        bg_opa: TRANSP
                        border_width: 3
                        border_color: 0x60A5FA
                        radius: 3
                    - obj:
                        x: 18
                        y: 6
                        width: 17
                        height: 26
                        bg_opa: TRANSP
                        border_width: 3
                        border_color: 0x60A5FA
                        radius: 3
                    - obj:
                        x: 7
                        y: 13
                        width: 8
                        height: 2
                        bg_color: 0x60A5FA
                        border_width: 0
                    - obj:
                        x: 7
                        y: 19
                        width: 8
                        height: 2
                        bg_color: 0x60A5FA
                        border_width: 0
                    - obj:
                        x: 23
                        y: 13
                        width: 8
                        height: 2
                        bg_color: 0x60A5FA
                        border_width: 0
                    - obj:
                        x: 23
                        y: 19
                        width: 8
                        height: 2
                        bg_color: 0x60A5FA
                        border_width: 0
              - label:
                  x: 72
                  y: 34
                  text_font: montserrat_28
                  text_color: 0x60A5FA
                  text: "RECIPE BUILDER"
              - label:
                  x: 26
                  y: 84
                  text_color: 0xCBD5E1
                  text: "8-Step Mash, Hop Timers & Slots"
              - label:
                  x: 26
                  y: 118
                  text_color: 0x64748B
                  text: "Edit steps or import BeerXML ->"

        # Tile 3: Hardware Setup (Amber Accent + Wrench Icon)
        - button:
            x: 20
            y: 285
            width: 370
            height: 175
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 16
            on_click:
              - script.execute: update_hardware_highlights
              - lvgl.page.show:
                  id: hardware_page
                  animation: NONE
            widgets:
              - obj:
                  x: 0
                  y: 24
                  width: 6
                  height: 125
                  bg_color: 0xF59E0B
                  border_width: 0
                  radius: 3
              # Wrench Vector Icon
              - obj:
                  x: 24
                  y: 30
                  width: 38
                  height: 38
                  bg_opa: TRANSP
                  border_width: 0
                  scrollable: false
                  pad_all: 0
                  widgets:
                    - obj:
                        x: 16
                        y: 12
                        width: 6
                        height: 22
                        bg_color: 0xFBBF24
                        border_width: 0
                        radius: 3
                    - obj:
                        x: 11
                        y: 3
                        width: 16
                        height: 14
                        bg_color: 0xFBBF24
                        border_width: 0
                        radius: 7
                    - obj:
                        x: 16
                        y: 2
                        width: 6
                        height: 8
                        bg_color: 0x111827
                        border_width: 0
                        radius: 1
              - label:
                  x: 72
                  y: 34
                  text_font: montserrat_28
                  text_color: 0xFBBF24
                  text: "HARDWARE"
              - label:
                  x: 26
                  y: 84
                  text_color: 0xCBD5E1
                  text: "BM10/20/50 Model, 230V Fuse & PID"
              - label:
                  x: 26
                  y: 118
                  text_color: 0x64748B
                  text: "Configure power limits & auto-tune ->"
        # Tile 4: Wi-Fi Settings (Violet Accent + Standard Wi-Fi Icon)
        - button:
            x: 410
            y: 285
            width: 370
            height: 175
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 16
            on_click:
              - lvgl.page.show:
                  id: wifi_page
                  animation: NONE
            widgets:
              - obj:
                  x: 0
                  y: 24
                  width: 6
                  height: 125
                  bg_color: 0x8B5CF6
                  border_width: 0
                  radius: 3
              # Standard Wi-Fi Signal Arcs Icon
              - obj:
                  x: 24
                  y: 30
                  width: 38
                  height: 38
                  bg_opa: TRANSP
                  border_width: 0
                  scrollable: false
                  pad_all: 0
                  widgets:
                    - arc:
                        x: 3
                        y: 7
                        width: 32
                        height: 32
                        start_angle: 225
                        end_angle: 315
                        value: 100
                        adjustable: false
                        arc_opa: TRANSP
                        indicator:
                          arc_width: 3
                          arc_color: 0xA78BFA
                    - arc:
                        x: 9
                        y: 13
                        width: 20
                        height: 20
                        start_angle: 225
                        end_angle: 315
                        value: 100
                        adjustable: false
                        arc_opa: TRANSP
                        indicator:
                          arc_width: 3
                          arc_color: 0xA78BFA
                    - obj:
                        x: 16
                        y: 26
                        width: 6
                        height: 6
                        bg_color: 0xA78BFA
                        border_width: 0
                        radius: 3
              - label:
                  x: 72
                  y: 34
                  text_font: montserrat_28
                  text_color: 0xA78BFA
                  text: "WIFI SETTINGS"
              - label:
                  x: 26
                  y: 84
                  text_color: 0xCBD5E1
                  text: "2.4 GHz Network & Web Dashboard"
              - label:
                  x: 26
                  y: 118
                  text_color: 0x64748B
                  text: "Scan networks & view controller IP ->"

    - id: brew_page
      widgets:
        - *home_btn
        # Unified Top Header Card
        - obj:
            x: 135
            y: 10
            width: 645
            height: 48
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 12
            scrollable: false
            pad_all: 0
            on_click:
              - lambda: |-
                  if (id(hop_alert_sec) > 0) {
                    id(hop_alert_sec) = 0;
                    id(alarm_buzzer).turn_off();
                    if (id(brew_state) == 3) id(status_text) = "BOILING (" + std::to_string(id(boil_power_pct)) + "% PWR)";
                  }
            widgets:
              - label:
                  id: lvgl_status_lbl
                  x: 14
                  y: 4
                  text_color: 0xF8FAFC
                  text: "IDLE - READY TO BREW"
              - label:
                  id: lvgl_hw_badge
                  x: 14
                  y: 25
                  text_color: 0x94A3B8
                  text: "0W (0.0A / 16A)"
              - label:
                  id: lvgl_wifi_lbl
                  align: TOP_RIGHT
                  x: -14
                  y: 4
                  text_color: 0xF59E0B
                  text: "WIFI: CHECKING..."
              - label:
                  id: lbl_brew_recipe
                  align: TOP_RIGHT
                  x: -14
                  y: 25
                  text_color: 0x38BDF8
                  text: "Recipe: Custom Braumeister Brew"

        # Card 1: Kettle Temp Arc Gauge (Amber Accent)
        - obj:
            x: 20
            y: 68
            width: 245
            height: 192
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - obj:
                  x: 24
                  y: 0
                  width: 197
                  height: 4
                  bg_color: 0xF59E0B
                  border_width: 0
                  radius: 2
              - arc:
                  id: arc_kettle_temp
                  align: CENTER
                  y: 12
                  width: 144
                  height: 144
                  min_value: 20
                  max_value: 100
                  value: 20
                  adjustable: false
                  arc_width: 12
                  arc_color: 0x1E293B
                  indicator:
                    arc_width: 12
                    arc_color: 0xF59E0B
              - label:
                  align: TOP_MID
                  y: 10
                  text_color: 0x94A3B8
                  text: "KETTLE TEMP"
              - label:
                  id: lbl_kettle_temp
                  align: CENTER
                  y: 12
                  text_font: montserrat_28
                  text_color: 0xF8FAFC
                  text: "--.- C"

        # Card 2: Target Temp & Step Badge (Sky Blue Accent)
        - obj:
            x: 280
            y: 68
            width: 245
            height: 192
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - obj:
                  x: 24
                  y: 0
                  width: 197
                  height: 4
                  bg_color: 0x38BDF8
                  border_width: 0
                  radius: 2
              - label:
                  align: TOP_MID
                  y: 14
                  text_color: 0x94A3B8
                  text: "TARGET TEMP"
              - label:
                  id: lbl_target_temp
                  align: CENTER
                  y: -4
                  text_font: montserrat_28
                  text_color: 0x38BDF8
                  text: "63.0 C"
              - obj:
                  x: 20
                  y: 142
                  width: 205
                  height: 1
                  bg_color: 0x1F2937
                  border_width: 0
              - label:
                  id: lbl_step_badge
                  align: BOTTOM_MID
                  y: -14
                  text_color: 0xCBD5E1
                  text: "Ready: Step 1 of 3"

        # Card 3: Step Timer & Aux Probe (Emerald Accent)
        - obj:
            x: 540
            y: 68
            width: 240
            height: 192
            bg_color: 0x111827
            border_width: 1
            border_color: 0x1F2937
            radius: 14
            scrollable: false
            pad_all: 0
            widgets:
              - obj:
                  x: 24
                  y: 0
                  width: 192
                  height: 4
                  bg_color: 0x34D399
                  border_width: 0
                  radius: 2
              - label:
                  align: TOP_MID
                  y: 14
                  text_color: 0x94A3B8
                  text: "STEP TIMER"
              - button:
                  id: btn_delay_minus
                  x: 10
                  y: 64
                  width: 46
                  height: 44
                  bg_color: 0x1E293B
                  radius: 10
                  on_click:
                    - lambda: 'if (id(brew_state) == 0 && id(delay_start_min) >= 30) id(delay_start_min) -= 30;'
                  widgets:
                    - label:
                        align: CENTER
                        text_color: 0xCBD5E1
                        text: "-30m"
              - label:
                  id: lbl_timer
                  align: CENTER
                  y: -4
                  text_font: montserrat_28
                  text_color: 0x34D399
                  text: "00:00"
              - button:
                  id: btn_delay_plus
                  x: 184
                  y: 64
                  width: 46
                  height: 44
                  bg_color: 0x1E293B
                  radius: 10
                  on_click:
                    - lambda: 'if (id(brew_state) == 0 && id(delay_start_min) < 720) id(delay_start_min) += 30;'
                  widgets:
                    - label:
                        align: CENTER
                        text_color: 0xCBD5E1
                        text: "+30m"
              - obj:
                  x: 20
                  y: 142
                  width: 200
                  height: 1
                  bg_color: 0x1F2937
                  border_width: 0
              - label:
                  id: lbl_sec_temp
                  align: BOTTOM_MID
                  y: -14
                  text_color: 0xCBD5E1
                  text: "Aux: --.- C"

        # Manual Override Row (Heaters & Pumps)
        - button:
            id: pill_htr1
            x: 20
            y: 274
            width: 180
            height: 54
            bg_color: 0x1E293B
            border_width: 1
            border_color: 0x334155
            radius: 14
            on_click:
              - lambda: |-
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); id(manual_htr_2) = false; }
                  id(manual_htr_1) = !id(manual_htr_1);
                  if (id(manual_htr_1) && id(max_amps) > 0 && id(max_amps) <= 13) id(manual_htr_2) = false;
                  id(heater_1_pwm).set_level(id(manual_htr_1) ? 1.0f : 0.0f);
                  id(heater_2_pwm).set_level((id(num_elements) == 2 && id(manual_htr_2)) ? 1.0f : 0.0f);
                  id(status_text) = "MANUAL OVERRIDE";
            widgets:
              - label:
                  id: lbl_pill_htr1
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "HTR 1: OFF"

        - button:
            id: pill_htr2
            x: 213
            y: 274
            width: 180
            height: 54
            bg_color: 0x1E293B
            border_width: 1
            border_color: 0x334155
            radius: 14
            on_click:
              - lambda: |-
                  if (id(num_elements) != 2) return;
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); id(manual_htr_1) = false; }
                  id(manual_htr_2) = !id(manual_htr_2);
                  if (id(manual_htr_2) && id(max_amps) > 0 && id(max_amps) <= 13) id(manual_htr_1) = false;
                  id(heater_1_pwm).set_level(id(manual_htr_1) ? 1.0f : 0.0f);
                  id(heater_2_pwm).set_level(id(manual_htr_2) ? 1.0f : 0.0f);
                  id(status_text) = "MANUAL OVERRIDE";
            widgets:
              - label:
                  id: lbl_pill_htr2
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "HTR 2: OFF"

        - button:
            id: pill_pump1
            x: 407
            y: 274
            width: 180
            height: 54
            bg_color: 0x1E293B
            border_width: 1
            border_color: 0x334155
            radius: 14
            on_click:
              - lambda: |-
                  if (!std::isnan(id(kettle_temp).state) && id(kettle_temp).state >= 88.0f) {
                    id(pump_1).turn_off();
                    id(status_text) = "PUMP LOCKOUT: TEMP >= 88C";
                    return;
                  }
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); }
                  id(pump_1).toggle();
                  id(status_text) = "MANUAL OVERRIDE";
            widgets:
              - label:
                  id: lbl_pill_pump1
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "PUMP 1: OFF"

        - button:
            id: pill_pump2
            x: 600
            y: 274
            width: 180
            height: 54
            bg_color: 0x1E293B
            border_width: 1
            border_color: 0x334155
            radius: 14
            on_click:
              - lambda: |-
                  if (id(num_pumps) != 2) return;
                  if (!std::isnan(id(kettle_temp).state) && id(kettle_temp).state >= 88.0f) {
                    id(pump_2).turn_off();
                    id(status_text) = "PUMP LOCKOUT: TEMP >= 88C";
                    return;
                  }
                  if (id(brew_state) != 0) { id(brew_state) = 0; auto c = id(bm_pid).make_call(); c.set_mode("OFF"); c.perform(); }
                  id(pump_2).toggle();
                  id(status_text) = "MANUAL OVERRIDE";
            widgets:
              - label:
                  id: lbl_pill_pump2
                  align: CENTER
                  text_color: 0xE2E8F0
                  text: "PUMP 2: OFF"
        # Primary Action Buttons (START / STOP / BOIL)
        - button:
            x: 20
            y: 344
            width: 245
            height: 112
            bg_color: 0x059669
            border_width: 2
            border_color: 0x34D399
            radius: 16
            on_click:
              - script.execute: cmd_start_brew
            widgets:
              - label:
                  align: CENTER
                  y: -10
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
                  text: "START"
              - label:
                  align: CENTER
                  y: 22
                  text_color: 0xD1FAE5
                  text: "Begin / Resume Mash"

        - button:
            x: 280
            y: 344
            width: 245
            height: 112
            bg_color: 0xDC2626
            border_width: 2
            border_color: 0xF87171
            radius: 16
            on_click:
              - script.execute: cmd_stop_all
            widgets:
              - label:
                  align: CENTER
                  y: -10
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
                  text: "STOP"
              - label:
                  align: CENTER
                  y: 22
                  text_color: 0xFEE2E2
                  text: "Halt Heaters & Pumps"

        - button:
            x: 540
            y: 344
            width: 240
            height: 112
            bg_color: 0xD97706
            border_width: 2
            border_color: 0xFBBF24
            radius: 16
            on_click:
              - script.execute: cmd_start_boil
            widgets:
              - label:
                  align: CENTER
                  y: -10
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
                  text: "BOIL"
              - label:
                  align: CENTER
                  y: 22
                  text_color: 0xFEF3C7
                  text: "Heat to 100 C & Hops"

        # Step Confirmation Overlay Modal
        - obj:
            id: step_confirm_modal
            align: CENTER
            width: 560
            height: 250
            bg_color: 0x111827
            border_width: 3
            border_color: 0xF59E0B
            radius: 16
            hidden: true
            scrollable: false
            pad_all: 0
            widgets:
              - obj:
                  x: 40
                  y: 0
                  width: 480
                  height: 5
                  bg_color: 0xF59E0B
                  border_width: 0
                  radius: 2
              - label:
                  id: lbl_modal_title
                  align: TOP_MID
                  y: 22
                  text_font: montserrat_28
                  text_color: 0xFACC15
                  text: "STEP 1 COMPLETE!"
              - label:
                  id: lbl_modal_body
                  align: CENTER
                  y: -12
                  text_color: 0xF8FAFC
                  text: "Check mash / stir, then tap CONTINUE"
              - button:
                  x: 130
                  y: 162
                  width: 300
                  height: 64
                  bg_color: 0x059669
