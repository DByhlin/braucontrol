packages:
  scripts: !include bm_scripts.yaml
  ui: !include bm_ui.yaml

esphome:
  name: braumeister-controller
  friendly_name: BrauControl
  includes:
    - <esp_wifi.h>
    - <vector>
    - <mdns.h>
    - braumeister_helpers.h
  on_boot:
    priority: -100
    then:
      - script.execute: register_beerxml_uploader
      - lambda: |-
          id(bm_pid).set_kp(id(pid_kp));
          id(bm_pid).set_ki(id(pid_ki));
          id(bm_pid).set_kd(id(pid_kd));
          for (lv_obj_t *tv : {id(recipe_tabs), id(hw_tabs), id(wifi_tabs)}) {
            lv_obj_t *tb_ptr = lv_tabview_get_tab_btns(tv);
            lv_obj_set_style_bg_color(tb_ptr, lv_color_hex(0x0F172A), LV_PART_MAIN);
            lv_obj_set_style_text_color(tb_ptr, lv_color_hex(0x94A3B8), LV_PART_MAIN);
            lv_obj_set_style_bg_color(tb_ptr, lv_color_hex(0x1E293B), (int)LV_PART_ITEMS | (int)LV_STATE_CHECKED);
            lv_obj_set_style_text_color(tb_ptr, lv_color_hex(0x38BDF8), (int)LV_PART_ITEMS | (int)LV_STATE_CHECKED);
            lv_obj_set_style_border_color(tb_ptr, lv_color_hex(0x38BDF8), (int)LV_PART_ITEMS | (int)LV_STATE_CHECKED);
          }
          // Sync Web UI dropdowns with restored flash globals
          if (id(num_elements) == 1 && id(element_watts) == 1200) id(web_bm_model).publish_state("BM10 (1200W)");
          else if (id(num_elements) == 1 && id(element_watts) == 2000) id(web_bm_model).publish_state("BM20 (2000W)");
          else if (id(num_elements) == 2 && id(num_pumps) == 1) id(web_bm_model).publish_state("BM50 1-Pump (3300W)");
          else id(web_bm_model).publish_state("BM50 2-Pump (3300W)");

          if (id(max_amps) == 10) id(web_fuse_limit).publish_state("10A (2.3kW)");
          else if (id(max_amps) == 13) id(web_fuse_limit).publish_state("13A (3.0kW)");
          else if (id(max_amps) == 16) id(web_fuse_limit).publish_state("16A (3.6kW)");
          else id(web_fuse_limit).publish_state("MAX / Unlimited");

      - script.execute: restore_brew_session
      - if:
          condition:
            lambda: 'return id(brew_state) != 0;'
          then:
            - lvgl.page.show:
                id: brew_page
                animation: NONE

      - delay: 12s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lvgl.label.update:
                id: boot_status_label
                text: "Starting in offline mode..."
            - delay: 1s
            - lvgl.widget.hide: boot_screen
  min_version: "2026.1.0"

preferences:
  flash_write_interval: 5s

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      flash_chip: gd

psram:
  mode: octal
  speed: 120MHz

logger:
  baud_rate: 115200
  hardware_uart: UART0

api:
  reboot_timeout: 0s

ota:
  platform: esphome

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_telemetry
      name: "1. Live Brew Telemetry"
      sorting_weight: 10
    - id: grp_controls
      name: "2. Remote Brew Controls"
      sorting_weight: 20
    - id: grp_recipe
      name: "3. Recipe & BeerXML Import"
      sorting_weight: 30
    - id: grp_hardware
      name: "4. Hardware & 230V Fuse Setup"
      sorting_weight: 40
  
wifi:
  id: my_wifi
  reboot_timeout: 0s
  ap:
    ssid: "BM-BrewController"
    ap_timeout: 5s
  on_connect:
    - script.execute: register_beerxml_uploader
    - lvgl.bar.update:
        id: wifi_progress_bar
        value: 100
        animated: true
    - lvgl.label.update:
        id: boot_status_label
        text: "Connected!"
    - delay: 500ms
    - lvgl.widget.hide: boot_screen

captive_portal:

http_request:
  useragent: BrauControl/1.0
  timeout: 5s

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  scan: true

ch422g:
  - id: ch422g_hub

pcf8574:
  - id: io_expander
    address: 0x20

output:
  - platform: gpio
    id: lcd_backlight_pin
    pin:
      ch422g: ch422g_hub
      number: 2
      mode: OUTPUT

  - platform: slow_pwm
    id: heater_1_pwm
    period: 2s
    pin:
      pcf8574: io_expander
      number: 0
      mode: OUTPUT
      inverted: true

  - platform: slow_pwm
    id: heater_2_pwm
    period: 2s
    pin:
      pcf8574: io_expander
      number: 1
      mode: OUTPUT
      inverted: true

  - platform: template
    id: pid_master_out
    type: float
    write_action:
      - lambda: |-
          if (id(brew_state) != 0) {
            float req_lvl = state;
            if (id(brew_state) == 3 && id(kettle_temp).state >= 98.5f) {
              req_lvl = (float)id(boil_power_pct) / 100.0f;
            }

            float h1_w = (id(num_elements) == 2) ? 2000.0f : (float)id(element_watts);
            float h2_w = (id(num_elements) == 2) ? 1300.0f : 0.0f;
            float total_watts = h1_w + h2_w;

            // Leave ~5% headroom for pumps on 230V breaker
            float max_watts = (id(max_amps) > 0) ? (id(max_amps) * 230.0f * 0.95f) : 9999.0f;
            float max_cap = (max_watts < total_watts) ? (max_watts / total_watts) : 1.0f;

            float final_lvl = (req_lvl > max_cap) ? max_cap : req_lvl;
            id(current_heat_level) = final_lvl;

            if (id(num_elements) == 1) {
              id(heater_1_pwm).set_level(final_lvl);
              id(heater_2_pwm).set_level(0.0f);
              id(active_h1_pct) = (int)(final_lvl * 100.0f);
              id(active_h2_pct) = 0;
            } else {
              float target_w = final_lvl * total_watts;
              bool is_holding = (id(brew_state) != 3) &&
                                !std::isnan(id(kettle_temp).state) &&
                                (id(kettle_temp).state >= (id(bm_pid).target_temperature - 1.0f));

              if (is_holding) {
                // Hold mash temperature using ONLY Heater 2 (1300W)
                float h2_lvl = std::min(1.0f, target_w / h2_w);
                id(heater_1_pwm).set_level(0.0f);
                id(heater_2_pwm).set_level(h2_lvl);
                id(active_h1_pct) = 0;
                id(active_h2_pct) = (int)(h2_lvl * 100.0f);
              } else if (id(max_amps) > 0 && id(max_amps) <= 13) {
                // On 10A/13A breaker during ramp/boil: alternate single element every 10s
                bool use_h1 = ((millis() / 10000) % 2 == 0);
                float h1_lvl = use_h1 ? std::min(1.0f, target_w / h1_w) : 0.0f;
                float h2_lvl = use_h1 ? 0.0f : std::min(1.0f, target_w / h2_w);
                id(heater_1_pwm).set_level(h1_lvl);
                id(heater_2_pwm).set_level(h2_lvl);
                id(active_h1_pct) = (int)(h1_lvl * 100.0f);
                id(active_h2_pct) = (int)(h2_lvl * 100.0f);
              } else {
                // Full dual-element ramp or boil
                id(heater_1_pwm).set_level(final_lvl);
                id(heater_2_pwm).set_level(final_lvl);
                id(active_h1_pct) = (int)(final_lvl * 100.0f);
                id(active_h2_pct) = (int)(final_lvl * 100.0f);
              }
            }
          }

light:
  - platform: binary
    id: backlight
    name: "LCD Backlight"
    output: lcd_backlight_pin
    restore_mode: ALWAYS_ON
    
display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    # Workaround for issue: https://github.com/esphome/esphome/issues/21379.
    # Whould only be an issue in 2026.10
    color_order: RGB
    pclk_frequency: 14MHz
    dimensions:
      width: 800
      height: 480
    enable_pin:
      ch422g: ch422g_hub
      number: 6

touchscreen:
  platform: gt911
  id: my_touchscreen
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT

one_wire:
  - platform: gpio
    pin: GPIO6

sensor:
  - platform: dallas_temp
    id: raw_temp_0
    internal: true
    index: 0
    update_interval: 2s

  - platform: dallas_temp
    id: raw_temp_1
    internal: true
    index: 1
    update_interval: 2s

  - platform: template
    id: kettle_temp
    name: "Kettle Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 1s
    web_server:
      sorting_group_id: grp_telemetry
      sorting_weight: 0
    lambda: |-
      float main_t = id(swap_probes) ? id(raw_temp_1).state : id(raw_temp_0).state;
      float aux_t  = id(swap_probes) ? id(raw_temp_0).state : id(raw_temp_1).state;
      if (std::isnan(main_t)) return NAN;
      // Blend 70% Mash Probe + 30% Kettle Probe during active Mash if Aux probe is valid
      if (id(brew_state) == 1 && !std::isnan(aux_t) && aux_t > 0.0f && aux_t < 105.0f) {
        return (aux_t * 0.70f) + (main_t * 0.30f);
      }
      return main_t;

  - platform: template
    id: secondary_temp
    name: "Mash Temp"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 1s
    web_server:
      sorting_group_id: grp_telemetry
      sorting_weight: 1
    lambda: |-
      return id(swap_probes) ? id(raw_temp_0).state : id(raw_temp_1).state;

  - platform: template
    id: live_watts
    name: "Live Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 2s
    web_server:
      sorting_group_id: grp_telemetry
      sorting_weight: 3
    lambda: |-
      float w = 0.0f;
      if (id(num_elements) == 1) {
        float el_w = (float)id(element_watts);
        if (id(brew_state) == 0) {
          if (id(manual_htr_1)) w += el_w;
        } else {
          w += el_w * (id(active_h1_pct) / 100.0f);
        }
      } else {
        if (id(brew_state) == 0) {
          if (id(manual_htr_1)) w += 2000.0f;
          if (id(manual_htr_2)) w += 1300.0f;
        } else {
          w += 2000.0f * (id(active_h1_pct) / 100.0f);
          w += 1300.0f * (id(active_h2_pct) / 100.0f);
        }
      }
      if (id(pump_1).state) w += 25.0f;
      if (id(num_pumps) == 2 && id(pump_2).state) w += 25.0f;
      return w;

  - platform: template
    id: live_amps
    name: "Current Draw"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    update_interval: 2s
    web_server:
      sorting_group_id: grp_telemetry
      sorting_weight: 4
    lambda: |-
      return id(live_watts).state / 230.0f;

