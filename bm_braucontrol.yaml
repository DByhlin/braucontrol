      sorting_weight: 2
    on_press:
      - script.execute: cmd_stop_all

  - platform: template
    name: "Start Boil Phase"
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 3
    on_press:
      - script.execute: cmd_start_boil

select:

  - platform: template
    name: "Braumeister Model"
    id: web_bm_model
    optimistic: true
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 1
    options:
      - "BM10 (1200W)"
      - "BM20 (2000W)"
      - "BM50 2-Pump (3300W)"
      - "BM50 1-Pump (3300W)"
    initial_option: "BM50 2-Pump (3300W)"
    on_value:
      - lambda: |-
          if (x == "BM10 (1200W)") {
            id(num_elements) = 1; id(num_pumps) = 1; id(element_watts) = 1200;
            id(manual_htr_2) = false; id(heater_2_pwm).set_level(0.0f); id(pump_2).turn_off();
          } else if (x == "BM20 (2000W)") {
            id(num_elements) = 1; id(num_pumps) = 1; id(element_watts) = 2000;
            id(manual_htr_2) = false; id(heater_2_pwm).set_level(0.0f); id(pump_2).turn_off();
          } else if (x == "BM50 1-Pump (3300W)") {
            id(num_elements) = 2; id(num_pumps) = 1; id(element_watts) = 3300;
            id(pump_2).turn_off();
          } else {
            id(num_elements) = 2; id(num_pumps) = 2; id(element_watts) = 3300;
          }
  
  - platform: template
    name: "Load Recipe Slot"
    optimistic: true
    web_server:
      sorting_group_id: grp_recipe
      sorting_weight: 3
    options:
      - "Slot 1"
      - "Slot 2"
      - "Slot 3"
      - "Slot 4"
      - "Slot 5"
      - "Slot 6"
      - "Slot 7"
      - "Slot 8"
    on_value:
      - lambda: |-
          std::string s_opt = x.str();
          if (s_opt.rfind("Slot ", 0) == 0) {
            id(selected_slot) = atoi(s_opt.substr(5).c_str());
          }
      - script.execute: load_from_selected_slot

  - platform: template
    name: "230V Fuse Limit"
    id: web_fuse_limit
    optimistic: true
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 2
    options:
      - "10A (2.3kW)"
      - "13A (3.0kW)"
      - "16A (3.6kW)"
      - "MAX / Unlimited"
    initial_option: "16A (3.6kW)"
    on_value:
      - lambda: |-
          if (x == "10A (2.3kW)") id(max_amps) = 10;
          else if (x == "13A (3.0kW)") id(max_amps) = 13;
          else if (x == "16A (3.6kW)") id(max_amps) = 16;
          else id(max_amps) = 0;

number:
