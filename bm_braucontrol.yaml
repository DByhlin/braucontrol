      mode: OUTPUT
      inverted: true

  - platform: gpio
    id: pump_2
    name: "Pump 2"
    pin:
      pcf8574: io_expander
      number: 3
      mode: OUTPUT
      inverted: true

  - platform: gpio
    id: alarm_buzzer
    name: "Alarm Buzzer"
    internal: true
    pin:
      pcf8574: io_expander
      number: 4
      mode: OUTPUT
      inverted: false

  - platform: template
    name: "Swap Temp Probes (Kettle <-> Aux)"
    id: web_swap_probes
    restore_mode: DISABLED
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 5
    lambda: |-
      return id(swap_probes);
    turn_on_action:
      - lambda: 'id(swap_probes) = true;'
    turn_off_action:
      - lambda: 'id(swap_probes) = false;'

climate:
  - platform: pid
    id: bm_pid
    name: "Braumeister PID"
    sensor: kettle_temp
    default_target_temperature: 65°C
    heat_output: pid_master_out
    control_parameters:
      kp: 0.15
      ki: 0.002
      kd: 1.5

text:
  - platform: template
    name: "BeerXML Import"
    id: beerxml_import
    mode: text
    optimistic: true
    on_value:
      - lambda: |-
         if (x.rfind("PACKED|", 0) == 0) {
           size_t p1 = 7;
           size_t p2 = x.find('|', p1);
           if (p2 != std::string::npos) {
             id(recipe_name) = x.substr(p1, p2 - p1);
             std::string rest = x.substr(p2 + 1);
             auto t = BM_TEMPS; auto m = BM_TIMES; auto h = BM_HOPS;
             int ms = 1, bt = 60, bp = 85, hc = 0;
             if (bm_unpack_recipe(rest, t, m, h, ms, bt, bp, hc)) {
               id(active_mash_steps) = ms;
               id(boil_time_min) = bt;
               id(boil_power_pct) = bp;
               id(active_hop_count) = hc;
               id(editing_mash_step) = 1;
               id(editing_hop_idx) = 1;
               id(paused_state) = 0;
               bm_unpack_ferm_meta(
                   rest,
                   id(recipe_est_og_pts),
                   id(recipe_est_fg_pts),
                   id(recipe_yeast),
                   id(recipe_ferm_stages));
               id(measured_og_pts) = id(recipe_est_og_pts);
               id(status_text) = "LOADED: " + id(recipe_name);
               id(sync_recipe_sliders).execute();
             }
           }
           return;
         }

text_sensor:
  - platform: template
    name: "Brew Status"
    id: web_brew_status
    update_interval: 2s
    web_server:
      sorting_group_id: grp_telemetry
      sorting_weight: 1
    lambda: 'return id(status_text);'

  - platform: template
    name: "Step Timer"
    id: web_step_timer
    update_interval: 2s
    web_server:
      sorting_group_id: grp_telemetry
      sorting_weight: 2
    lambda: |-
      if (id(brew_state) == 7) {
        int rem = id(delay_start_sec);
        int hrs = rem / 3600;
        int mns = (rem % 3600) / 60;
        int scs = rem % 60;
        if (hrs > 0) return (hrs < 10 ? "0" : "") + std::to_string(hrs) + "h " + (mns < 10 ? "0" : "") + std::to_string(mns) + "m";
        return (mns < 10 ? "0" : "") + std::to_string(mns) + ":" + (scs < 10 ? "0" : "") + std::to_string(scs);
      }
      int mins = id(seconds_remaining) / 60;
      int secs = id(seconds_remaining) % 60;
      return (mins < 10 ? "0" : "") + std::to_string(mins) + ":" + (secs < 10 ? "0" : "") + std::to_string(secs);

  - platform: template
    name: "Active Recipe"
    id: web_active_recipe
    update_interval: 3s
    web_server:
      sorting_group_id: grp_recipe
      sorting_weight: 1
    lambda: 'return id(recipe_name);'

  - platform: template
    name: "BeerXML Uploader Link"
    update_interval: 10s
    web_server:
      sorting_group_id: grp_recipe
      sorting_weight: 2
    lambda: |-
      if (id(my_wifi).is_connected() && !id(my_wifi).get_ip_addresses().empty()) {
        std::vector<char> ip_buf(network::IP_ADDRESS_BUFFER_SIZE, 0);
        id(my_wifi).get_ip_addresses().at(0).str_to(ip_buf.data());
        return std::string("http://") + ip_buf.data() + "/brewcontrol";
      }
      return std::string("http://192.168.4");


  - platform: template
    name: "Hardware Profile"
    id: web_hw_profile
    update_interval: 3s
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 1
    lambda: 'return id(hw_status_text);'
button:
