    name: "Pump Run Interval"
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    update_interval: 2s
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 3
    lambda: 'return id(pump_run_min);'
    set_action:
