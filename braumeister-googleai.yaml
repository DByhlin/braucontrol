  - platform: template
    name: "Start Boil Phase"
    web_server:
      sorting_group_id: grp_controls
      sorting_weight: 3
    on_press:
      - script.execute: cmd_start_boil

select:

  - platform: template
    name: "Braumeister Model"
    optimistic: true
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 1
    options:
      - "BM10 (1200W)"
      - "BM20 (2000W)"
      - "BM50 2-Pump (3200W)"
      - "BM50 1-Pump (3200W)"
    initial_option: "BM50 2-Pump (3200W)"
    on_value:
      - lambda: |-
          if (x == "BM10 (1200W)") {
            id(num_elements) = 1; id(num_pumps) = 1; id(element_watts) = 1200; id(pump_2).turn_off();
          } else if (x == "BM20 (2000W)") {
            id(num_elements) = 1; id(num_pumps) = 1; id(element_watts) = 2000; id(pump_2).turn_off();
          } else if (x == "BM50 1-Pump (3200W)") {
            id(num_elements) = 2; id(num_pumps) = 1; id(element_watts) = 3200; id(pump_2).turn_off();
          } else {
            id(num_elements) = 2; id(num_pumps) = 2; id(element_watts) = 3200;
          }
  
  - platform: template
    name: "Load Recipe Slot"
    optimistic: true
    web_server:
      sorting_group_id: grp_recipe
      sorting_weight: 3
    options:
      - "Slot 1"
      - "Slot 2"
      - "Slot 3"
      - "Slot 4"
    on_value:
      - lambda: |-
          if (x == "Slot 1") id(selected_slot) = 1;
          else if (x == "Slot 2") id(selected_slot) = 2;
          else if (x == "Slot 3") id(selected_slot) = 3;
          else if (x == "Slot 4") id(selected_slot) = 4;
      - script.execute: load_from_selected_slot

  - platform: template
    name: "230V Fuse Limit"
    optimistic: true
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 2
    options:
      - "10A (2.3kW)"
      - "13A (3.0kW)"
      - "16A (3.6kW)"
      - "MAX / Unlimited"
    initial_option: "16A (3.6kW)"
    on_value:
      - lambda: |-
          if (x == "10A (2.3kW)") id(max_amps) = 10;
          else if (x == "13A (3.0kW)") id(max_amps) = 13;
          else if (x == "16A (3.6kW)") id(max_amps) = 16;
          else id(max_amps) = 0;

number:
  - platform: template
    name: "Pump Run Interval"
    unit_of_measurement: "min"
    min_value: 1
    max_value: 30
    step: 1
    update_interval: 2s
    web_server:
      sorting_group_id: grp_hardware
      sorting_weight: 3
    lambda: 'return id(pump_run_min);'
    set_action:
      - lambda: 'id(pump_run_min) = (int)x;'

  - platform: template
    name: "Pump Rest Interval"
